<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>竞速仪表盘 - 基础游戏 UI</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121a24;
    --accent: #00e5a0;
    --accent2: #ff4d6d;
    --text: #e8f0f7;
    --muted: #6b7a8a;
    --dial: #0d141c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #16222f 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  .dashboard {
    width: min(92vw, 460px);
    background: var(--panel);
    border: 1px solid #1f2c3a;
    border-radius: 22px;
    padding: 26px 24px 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 18px;
  }
  .card {
    flex: 1;
    background: var(--dial);
    border: 1px solid #1f2c3a;
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
  }
  .card .label {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .card .value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .card.lap .value { color: var(--accent); }
  .card.time .value { color: #ffd166; }
  .gauge-wrap {
    position: relative;
    display: flex;
    justify-content: center;
  }
  canvas { display: block; width: 100%; max-width: 340px; height: auto; }
  .status {
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 6px 0 16px;
    min-height: 18px;
  }
  .status.running { color: var(--accent); }
  .status.finished { color: #ffd166; }
  .controls {
    display: flex;
    gap: 12px;
  }
  button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #startBtn { background: var(--accent); color: #04231a; }
  #resetBtn { background: var(--accent2); color: #2b0510; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
  }
  .hint kbd {
    background: #1f2c3a;
    border-radius: 5px;
    padding: 2px 7px;
    font-family: inherit;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="dashboard">
    <div class="topbar">
      <div class="card lap">
        <div class="label">当前圈数</div>
        <div class="value" id="lapValue">1 / 3</div>
      </div>
      <div class="card time">
        <div class="label">计时器</div>
        <div class="value" id="timeValue">00:00.00</div>
      </div>
    </div>

    <div class="gauge-wrap">
      <canvas id="gauge" width="680" height="680"></canvas>
    </div>

    <div class="status" id="status">准备就绪</div>

    <div class="controls">
      <button id="startBtn">开始</button>
      <button id="resetBtn" disabled>重置</button>
    </div>

    <div class="hint">按住 <kbd>↑</kbd>/<kbd>W</kbd> 加速 · <kbd>↓</kbd>/<kbd>S</kbd> 刹车 · <kbd>空格</kbd> 开始/重置</div>
  </div>

  <script>
  (function () {
    "use strict";

    // ---------- 配置 ----------
    var MAX_SPEED = 240;        // km/h
    var ACCEL = 150;            // km/h per second
    var BRAKE = 260;            // km/h per second
    var DRAG = 35;              // 自然减速 km/h per second
    var LAP_LENGTH = 1.0;       // 每圈距离（公里）
    var TOTAL_LAPS = 3;

    // ---------- DOM ----------
    var canvas = document.getElementById("gauge");
    var ctx = canvas.getContext("2d");
    var lapValueEl = document.getElementById("lapValue");
    var timeValueEl = document.getElementById("timeValue");
    var statusEl = document.getElementById("status");
    var startBtn = document.getElementById("startBtn");
    var resetBtn = document.getElementById("resetBtn");

    // ---------- 状态 ----------
    var speed = 0;          // km/h
    var distance = 0;       // km（当前圈内已跑距离）
    var currentLap = 1;     // 当前圈数
    var elapsed = 0;        // 秒
    var state = "idle";     // idle | running | finished
    var lastTs = 0;
    var keys = { up: false, down: false };

    // ---------- 仪表盘绘制 ----------
    var CX = canvas.width / 2;
    var CY = canvas.height / 2;
    var R = canvas.width / 2 - 40;
    var START_DEG = 135;
    var SWEEP_DEG = 270;

    function degToRad(deg) { return deg * Math.PI / 180; }

    function polar(deg, r) {
      var a = degToRad(deg);
      return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
    }

    function drawGauge() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景表盘
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.fillStyle = "#0d141c";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#1f2c3a";
      ctx.stroke();

      // 彩色速度区段弧
      var zones = [
        [0, 80, "#00e5a0"],
        [80, 160, "#ffd166"],
        [160, MAX_SPEED, "#ff4d6d"]
      ];
      ctx.lineWidth = 16;
      ctx.lineCap = "round";
      zones.forEach(function (z) {
        var a0 = START_DEG + (z[0] / MAX_SPEED) * SWEEP_DEG;
        var a1 = START_DEG + (z[1] / MAX_SPEED) * SWEEP_DEG;
        ctx.beginPath();
        ctx.strokeStyle = z[2];
        ctx.arc(CX, CY, R - 34, degToRad(a0), degToRad(a1));
        ctx.stroke();
      });

      // 刻度
      for (var s = 0; s <= MAX_SPEED; s += 10) {
        var a = START_DEG + (s / MAX_SPEED) * SWEEP_DEG;
        var isMajor = s % 40 === 0;
        var r1 = R - (isMajor ? 62 : 54);
        var r2 = R - 40;
        var p1 = polar(a, r1);
        var p2 = polar(a, r2);
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.strokeStyle = isMajor ? "#8fa2b8" : "#3a4a5c";
        ctx.lineWidth = isMajor ? 5 : 2;
        ctx.stroke();
        if (isMajor) {
          var pt = polar(a, R - 88);
          ctx.fillStyle = "#8fa2b8";
          ctx.font = "bold 34px 'Segoe UI', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(s), pt[0], pt[1]);
        }
      }

      // 速度指针（默认指向正右，再旋转到对应角度）
      var needleDeg = START_DEG + (speed / MAX_SPEED) * SWEEP_DEG;
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(degToRad(needleDeg));
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(R - 110, 0);
      ctx.lineTo(0, 12);
      ctx.closePath();
      ctx.fillStyle = "#ff4d6d";
      ctx.fill();
      ctx.restore();

      // 中心轴
      ctx.beginPath();
      ctx.arc(CX, CY, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#e8f0f7";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(CX, CY, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#0b0f14";
      ctx.fill();

      // 数字速度
      ctx.fillStyle = "#e8f0f7";
      ctx.font = "bold 92px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(String(Math.round(speed)), CX, CY + 130);

      ctx.fillStyle = "#6b7a8a";
      ctx.font = "500 34px 'Segoe UI', sans-serif";
      ctx.fillText("km/h", CX, CY + 176);
    }

    // ---------- 计时器格式化 ----------
    function formatTime(t) {
      var m = Math.floor(t / 60);
      var s = t - m * 60;
      var sec = Math.floor(s);
      var cs = Math.floor((s - sec) * 100);
      var mm = String(m).padStart(2, "0");
      var ss = String(sec).padStart(2, "0");
      var cc = String(cs).padStart(2, "0");
      return mm + ":" + ss + "." + cc;
    }

    function updateUI() {
      lapValueEl.textContent = currentLap + " / " + TOTAL_LAPS;
      timeValueEl.textContent = formatTime(elapsed);
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = "status" + (cls ? " " + cls : "");
    }

    // ---------- 流程控制 ----------
    function startRace() {
      if (state === "running") return;
      speed = 0;
      distance = 0;
      currentLap = 1;
      elapsed = 0;
      state = "running";
      startBtn.disabled = true;
      resetBtn.disabled = false;
      setStatus("竞速进行中…", "running");
    }

    function resetRace() {
      state = "idle";
      speed = 0;
      distance = 0;
      currentLap = 1;
      elapsed = 0;
      startBtn.disabled = false;
      resetBtn.disabled = true;
      setStatus("准备就绪");
      updateUI();
      drawGauge();
    }

    function finishRace() {
      state = "finished";
      startBtn.disabled = true;
      resetBtn.disabled = false;
      setStatus("完成！用时 " + formatTime(elapsed), "finished");
    }

    function toggleBySpace() {
      if (state === "running") { resetRace(); }
      else { startRace(); }
    }

    // ---------- 主循环 ----------
    function frame(ts) {
      var dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;

      if (state === "running") {
        var a = 0;
        if (keys.up) a += ACCEL;
        if (keys.down) a -= BRAKE;
        a -= (speed / MAX_SPEED) * DRAG;
        speed = Math.max(0, Math.min(MAX_SPEED, speed + a * dt));

        distance += (speed / 3600) * dt;
        if (distance >= LAP_LENGTH) {
          distance -= LAP_LENGTH;
          currentLap++;
          if (currentLap > TOTAL_LAPS) {
            currentLap = TOTAL_LAPS;
            finishRace();
          }
        }

        elapsed += dt;
      }

      drawGauge();
      updateUI();
      requestAnimationFrame(frame);
    }

    // ---------- 事件 ----------
    startBtn.addEventListener("click", startRace);
    resetBtn.addEventListener("click", resetRace);

    window.addEventListener("keydown", function (e) {
      var k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") keys.up = true;
      if (k === "arrowdown" || k === "s") keys.down = true;
      if (k === " ") { e.preventDefault(); toggleBySpace(); }
      if ((k === "arrowup" || k === "arrowdown" || k === "w" || k === "s") && state === "idle") {
        startRace();
      }
    });
    window.addEventListener("keyup", function (e) {
      var k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") keys.up = false;
      if (k === "arrowdown" || k === "s") keys.down = false;
    });

    // ---------- 初始化 ----------
    resetRace();
    lastTs = performance.now();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
