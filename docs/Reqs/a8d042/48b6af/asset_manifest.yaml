# asset_manifest.yaml — 初始化项目脚手架与技术栈
# 由美术 Agent 完整生成，覆盖 UX Agent 的初稿
# status: pending=待生产 / sourced=已从资产库获取 / generated=已AI生成
assets:
  - id: error_alert
    type: icon
    description: 错误提示警告图标 24px outline
    source_hint: iconify
    status: pending
  - id: retry
    type: icon
    description: 重试按钮刷新图标 16px outline
    source_hint: iconify
    status: pending
  - id: debug_fps
    type: icon
    description: FPS 调试面板指示图标 16px
    source_hint: iconify
    status: pending
  - id: mono_ui
    type: font
    description: HUD 等宽数字字体 JetBrains Mono
    source_hint: google_fonts
    status: pending