    status: pending
  - id: btn_brake
    type: icon
    description: 刹车/倒车按键图标 向下箭头 24px outline
    source_hint: iconify
    status: pending
  - id: btn_steer_left
    type: icon
    description: 左转按键图标 向左箭头 24px outline
    source_hint: iconify
    status: pending
  - id: btn_steer_right
    type: icon
    description: 右转按键图标 向右箭头 24px outline
    source_hint: iconify
    status: pending