# asset_manifest.yaml — 构建 3D 环形赛道场景
# 由美术 Agent 完整生成，覆盖 UX Agent 的初稿
# status: pending=待生产 / sourced=已从资产库获取 / generated=已AI生成
assets:
  - id: camera_view
    type: icon
    description: 相机视角切换图标 24px outline
    source_hint: iconify
    status: pending
  - id: debug_panel
    type: icon
    description: 调试面板开关齿轮图标 24px outline
    source_hint: iconify
    status: pending
  - id: retry
    type: icon
    description: 重试/重新生成图标 24px outline
    source_hint: iconify
    status: pending