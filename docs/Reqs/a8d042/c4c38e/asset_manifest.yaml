# asset_manifest.yaml — 构建 3D 环形赛道场景
# 由美术 Agent 完整生成，覆盖 UX Agent 的初稿
# status: pending=待生产 / sourced=已从资产库获取 / generated=已AI生成
assets:
  - id: camera_view
    type: icon
    description: 相机视角切换图标 24px outline 风格
    source_hint: iconify
    status: pending
  - id: debug_panel
    type: icon
    description: 调试面板开关图标 24px outline 风格
    source_hint: iconify
    status: pending
  - id: retry
    type: icon
    description: 重试/重新生成图标 24px outline 风格
    source_hint: iconify
    status: pending
  - id: collapse
    type: icon
    description: 抽屉折叠箭头图标 20px outline 风格
    source_hint: iconify
    status: pending
  - id: error_warning
    type: icon
    description: 错误提示图标 48px outline 风格
    source_hint: iconify
    status: pending
  - id: start_line_checker
    type: texture
    description: 起点线黑白棋盘格程序化纹理 128x128（代码生成，非外部贴图）
    source_hint: procedural
    status: pending
  - id: ui_click
    type: audio
    description: 按钮点击音效（原型可选）
    source_hint: kenney
    status: pending